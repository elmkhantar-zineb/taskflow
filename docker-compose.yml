services:
  web:
    image: hamzaelmkhantar/taskflow-web:${WEB_VERSION:? WEB_VERSION is required}
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - 8080:80
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 125M

  api:
    image: hamzaelmkhantar/taskflow-api:${API_VERSION:? API_VERSION is required}
    build:
      context: ./api
      dockerfile: Dockerfile
      # That publishes the API on all host interfaces, not only the Compose network.
    # ports:
    #   - 3000:3000
    environment:
      - NODE_ENV=production
    env_file:
      - ./api/.env.production
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health/live').then(r => { process.exit(r.ok ? 0 : 1) }).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    mem_limit: 512M
    cpus: 1.0
    stop_grace_period: 30s
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped

  mongodb:
    image: mongo:9
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "quit(db.adminCommand('ping').ok ? 0 : 1)"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    mem_limit: 1024M
    restart: unless-stopped

volumes:
  mongodb-data:
