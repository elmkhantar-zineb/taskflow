services:
  taskflow-web:
    image: taskflow-web:1.0.0
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - 8080:80
    depends_on:
      taskflow-api:
        condition: service_healthy
    restart: unless-stopped

  taskflow-api:
    image: taskflow-api:1.0.0
    build:
      context: ./api
      dockerfile: Dockerfile
    ports:
      - 3000:3000
    environment:
      - NODE_ENV=production
      - MONGODB_URI=mongodb://taskflow-mongodb:27017/TaskFlow
    env_file:
      - ./api/.env
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health/live').then(r => { process.exit(r.ok ? 0 : 1) }).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

    stop_grace_period: 15s
    depends_on:
      taskflow-mongodb:
        condition: service_healthy
    restart: unless-stopped

  taskflow-mongodb:
    image: mongo:9
    volumes:
      - taskflow-mongodb-data:/data/db
    healthcheck:
      test:
        - CMD
        - mongosh
        - --eval
        - --quiet
        - "db.adminCommand('ping').ok ? quit(0) : quit(1)"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

volumes:
  taskflow-mongodb-data:
