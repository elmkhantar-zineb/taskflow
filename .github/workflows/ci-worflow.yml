name: taskflow continuous integration

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  frontend-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run lint
        run: npm run lint

  frontend-unit-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests
        run: npm run test:unit

  frontend-integration-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install Dependencies
        run: npm ci
      - name: Run Integration Tests
        run: npm run test:integration

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run build
        run: npm run build
      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: web-build
          path: web/dist
          if-no-files-found: error
          retention-days: 7

  frontend-download-build:
    runs-on: ubuntu-latest
    needs: frontend-build
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: web-build
          path: web/dist

      - name: list files
        run: |
          ls -la web/dist
          test -f web/dist/index.html

  backend-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: api/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run lint
        run: npm run lint

  backend-unit-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: api/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests
        run: npm run test:unit

  backend-integration-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: api/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run integration tests
        run: npm run test:integration

  backend-docker-build:
    needs: [backend-lint, backend-unit-tests, backend-integration-tests]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - name: checkout code
        uses: actions/checkout@v4
      - name: Setup QEMU
        uses: docker/setup-qemu-action@v4
      - name: set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: login to Docker Hub
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Generate short SHA
        id: git
        run: echo "short_sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
      - name: Validate backend docker image on PRs
        if: github.event_name == 'pull_request'
        run: |
          docker buildx build \
          -t hamzaelmkhantar/taskflow-api:ci \
          --platform linux/amd64,linux/arm64 \
          .
      - name: build and push main image
        if: github.event_name == 'push' &&  github.ref == 'refs/heads/main'
        run: |
          docker buildx build \
          --platform linux/amd64,linux/arm64 \
          -t hamzaelmkhantar/taskflow-api:${{ steps.git.outputs.short_sha }} \
          -t hamzaelmkhantar/taskflow-api:latest \
           --push \
           .

      - name: build and push release image
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          VERSION=${RELEASE_TAG#v}

          docker buildx build \
          --platform linux/amd64,linux/arm64 \
          -t hamzaelmkhantar/taskflow-api:${VERSION} \
          --push \
          .

  frontend-docker-build:
    needs:
      [
        frontend-lint,
        frontend-unit-tests,
        frontend-integration-tests,
        frontend-build,
      ]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: checkout code
        uses: actions/checkout@v4
      - name: Setup QEMU
        uses: docker/setup-qemu-action@v4
      - name: set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: login to Docker Hub
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Generate short SHA
        id: git
        run: echo "short_sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
      - name: Validate frontend docker image on PRs
        if: github.event_name == 'pull_request'
        run: |
          docker buildx build \
          -t hamzaelmkhantar/taskflow-web:ci \
          --platform linux/amd64,linux/arm64 \
          .
      - name: build and push main image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |

          docker buildx build \
          -t hamzaelmkhantar/taskflow-web:${{ steps.git.outputs.short_sha }} \
          -t hamzaelmkhantar/taskflow-web:latest \
          --platform linux/amd64,linux/arm64 \
          --push \
          .

      - name: Build and push release image
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          VERSION=${RELEASE_TAG#v}

          docker buildx build \
          --platform linux/amd64,linux/arm64 \
          -t hamzaelmkhantar/taskflow-web:${VERSION} \
          --push \
          .

  smoke-tests:
    needs:
      - frontend-docker-build
      - backend-docker-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup docker action
        uses: docker/setup-docker-action@v5
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Generate short SHA
        id: git
        run: echo "short_sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
      - name: Run Smoke Tests on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          export API_VERSION=${{steps.git.outputs.short_sha}} && export WEB_VERSION=${{steps.git.outputs.short_sha}}
          docker pull hamzaelmkhantar/taskflow-web:${{steps.git.outputs.short_sha}}
          docker pull hamzaelmkhantar/taskflow-api:${{steps.git.outputs.short_sha}}
          docker compose up -d --no-build --wait

          curl --fail --silent --show-error http://localhost:8080/
          curl --fail --silent --show-error http://localhost:8080/api/tasks

      - name: Run Smoke Tests on release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          export API_VERSION=${RELEASE_TAG#v} && export WEB_VERSION=${RELEASE_TAG#v}
          docker pull hamzaelmkhantar/taskflow-web:${RELEASE_TAG#v}
          docker pull hamzaelmkhantar/taskflow-api:${RELEASE_TAG#v}
          docker compose up -d --no-build --wait

          curl --fail --silent --show-error http://localhost:8080/
          curl --fail --silent --show-error http://localhost:8080/api/tasks

          if: failure()
          run: |
            docker compose ps
            docker compose logs --no-color --tail 100

          if: always()
          run: |
            docker compose down -v --remove-orphans
