name: taskflow continuous integration

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main


jobs:
    lint:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: web
        steps:
            - name: Checkout Code
              uses: actions/checkout@v4
            - name: setup Node.js
              uses: actions/setup-node@v4
              with:
                node-version: 24
                cache: npm
                cache-dependency-path: web/package-lock.json
            - name: Install dependencies
              run: npm ci
            - name: Run lint
              run: npm run lint