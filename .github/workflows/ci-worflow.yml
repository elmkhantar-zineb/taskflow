name: taskflow continuous integration

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main


jobs:
    lint:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Code
              uses: actions/checkout@v4
            - name: enter to the web directory
              run: cd web
            - name: Install dependencies
              run: npm install
            - name: Run lint
              run: npm run lint