name: taskflow continuous integration

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
    contents: read

jobs:
  frontend-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run lint
        run: npm run lint

  frontend-unit-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests
        run: npm run test:unit

  frontend-integration-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
        - name: Checkout Code
          uses: actions/checkout@v4
        - name: Setup Node.js
          uses: actions/setup-node@v4
          with:
            node-version: 24
            cache: npm
            cache-dependency-path: web/package-lock.json
        - name: Install Dependencies
          run: npm ci
        - name: Run Integration Tests
          run: npm run test:integration



  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run build
        run: npm run build
      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
            name: web-build
            path: web/dist
            if-no-files-found: error
            retention-days: 7

  frontend-download-build:
    runs-on: ubuntu-latest
    needs: frontend-build
    steps:
        - name: Download build artifacts
          uses: actions/download-artifact@v8
          with:
            name: web-build
            path: web/dist

        - name: list files
          run: |
            ls -la web/dist
            test -f web/dist/index.html


  backend-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: api/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run lint
        run: npm run lint

  backend-unit-tests:
    runs-on: ubuntu-latest
    defaults:
        run:
            working-directory: api
    steps:
        - name: Checkout Code
          uses: actions/checkout@v4
        - name: Setup Node.js
          uses: actions/setup-node@v4
          with:
            node-version: 24
            cache: npm
            cache-dependency-path: api/package-lock.json
        - name: Install dependencies
          run: npm ci
        - name: Run unit tests
          run: npm run test:unit

  backend-integration-tests:
    runs-on: ubuntu-latest
    defaults:
        run:
            working-directory: api
    steps:
        - name: Checkout Code
          uses: actions/checkout@v4
        - name: Setup Node.js
          uses: actions/setup-node@v4
          with:
            node-version: 24
            cache: npm
            cache-dependency-path: api/package-lock.json
        - name: Install dependencies
          run: npm ci
        - name: Run integration tests
          run: npm run test:integration


  backend-docker-build:
    needs: [backend-lint, backend-unit-tests, backend-integration-tests]
    runs-on: ubuntu-latest
    defaults:
        run:
            working-directory: api
    steps:
        - name: checkout code
          uses: actions/checkout@v4
        - name: set up Docker Buildx
          uses: docker/setup-buildx-action@v3
        - name: login to Docker Hub
          uses: docker/login-action@v3
          with:
            username: ${{ secrets.DOCKER_USERNAME }}
            password: ${{ secrets.DOCKER_PASSWORD }}
        - name: Generate short SHA
          id: git
          run: echo "short_sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
        - name: build and push docker image
          run: |
            docker buildx build -t hamzaelmkhantar/taskflow-api:${{ steps.git.outputs.short_sha }} \
            -t hamzaelmkhantar/taskflow-api:latest --platform linux/amd64,linux/arm64 --push .

  frontend-docker-build:
    needs: [frontend-lint, frontend-unit-tests, frontend-integration-tests]
    runs-on: ubuntu-latest
    defaults:
        run:
            working-directory: web
    steps:
        - name: checkout code
          uses: actions/checkout@v4
        - name: set up Docker Buildx
          uses: docker/setup-buildx-action@v3
        - name: login to Docker Hub
          uses: docker/login-action@v3
          with:
            username: ${{ secrets.DOCKER_USERNAME }}
            password: ${{ secrets.DOCKER_PASSWORD }}
        - name: Generate short SHA
          id: git
          run: echo "short_sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
        - name: build docker image
          run: |
            docker buildx build -t hamzaelmkhantar/taskflow-web:${{ steps.git.outputs.short_sha }} \
            -t hamzaelmkhantar/taskflow-web:latest --platform linux/amd64,linux/arm64 --push .